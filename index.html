<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagarin Parfum</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f5f7);
            --text-color: var(--tg-theme-text-color, #222);
            --card-bg: var(--tg-theme-secondary-bg-color, #fff);
            --btn-bg: var(--tg-theme-button-color, #000);
            --btn-text: var(--tg-theme-button-text-color, #fff);
            --hint-color: var(--tg-theme-hint-color, #888);
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0 auto;
            padding: 0 0 90px 0;
            max-width: 500px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        header { padding: 20px 15px 10px; display: flex; justify-content: center; }
        h1 { margin: 0; font-size: 24px; font-weight: 700; }

        .categories-wrapper {
            position: sticky; top: 0; background: var(--bg-color); padding: 10px 15px;
            z-index: 100; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
        }
        
        .category-btn {
            background: var(--card-bg); color: var(--text-color); border: 1px solid var(--hint-color);
            padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .category-btn.active { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }

        .catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; justify-items: center; }

        .product-card {
            background: var(--card-bg); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; width: 100%; text-align: left; cursor: pointer;
        }
        .product-img-container {
            width: 100%; aspect-ratio: 3 / 4; position: relative; background-color: #f0f0f0;
        }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .photo-badge {
            position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff;
            font-size: 10px; padding: 2px 6px; border-radius: 6px;
        }

        .product-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 13px; font-weight: 700; margin: 0 0 4px; line-height: 1.2; }
        .product-desc { font-size: 11px; color: var(--hint-color); margin: 0 0 8px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .product-price { font-size: 14px; font-weight: 700; }
        
        .action-btn { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .cart-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; background: var(--card-bg); box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            padding: 15px; box-sizing: border-box; display: none; justify-content: space-between; align-items: center; z-index: 900;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .cart-info { text-align: left; }
        .cart-count { font-size: 12px; color: var(--hint-color); }
        .cart-total { font-size: 16px; font-weight: 700; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg); color: var(--text-color); width: 100%; max-width: 400px;
            border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; text-align: left; position: relative;
        }
        .modal-slider { width: 100%; aspect-ratio: 3 / 4; position: relative; background: #000; }
        .modal-slider img { width: 100%; height: 100%; object-fit: contain; }
        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 10px; cursor: pointer; font-size: 16px; border-radius: 50%;
        }
        .slider-prev { left: 10px; }
        .slider-next { right: 10px; }
        .modal-body { padding: 15px; overflow-y: auto; }
        .modal-title { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
        .modal-desc { font-size: 13px; color: var(--hint-color); margin: 0 0 15px; line-height: 1.4; }
        
        .counter-container { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .counter-btn { background: var(--bg-color); color: var(--text-color); border: 1px solid var(--hint-color); width: 40px; height: 40px; border-radius: 50%; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .counter-value { font-size: 18px; font-weight: 700; min-width: 60px; text-align: center; }

        .modal-footer { display: flex; justify-content: space-between; align-items: center; }
        .modal-price { font-size: 18px; font-weight: 700; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 1010; font-size: 16px; }

        .loading { grid-column: span 2; text-align: center; padding: 40px 20px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>Gagarin Parfum</h1>
    </header>

    <div class="categories-wrapper" id="categories"></div>
    <div class="catalog" id="catalog">
        <div class="loading">⏳ Загружаем каталог...</div>
    </div>

    <!-- Плавающая панель корзины -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <div class="cart-count" id="cartCountText">Общий объем: 0 мл</div>
            <div class="cart-total" id="cartTotalText">0 ₽</div>
        </div>
        <button class="action-btn" style="padding: 12px 24px; font-size: 14px;" onclick="checkout()">Оформить заказ</button>
    </div>

    <!-- Модальное окно товара -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <div class="modal-slider" id="modalSlider">
                <img id="modalImg" src="" alt="">
                <button class="slider-btn slider-prev" id="prevBtn" onclick="changeSlide(-1)">❮</button>
                <button class="slider-btn slider-next" id="nextBtn" onclick="changeSlide(1)">❯</button>
            </div>
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-desc" id="modalDesc"></p>
                
                <div style="font-size: 12px; color: var(--hint-color); margin-bottom: 5px;">Объем (мл):</div>
                <div class="counter-container">
                    <button class="counter-btn" onclick="updateModalQty(-5)">−</button>
                    <span class="counter-value" id="modalQty">5 мл</span>
                    <button class="counter-btn" onclick="updateModalQty(5)">+</button>
                </div>

                <div class="modal-footer">
                    <span class="modal-price" id="modalPrice"></span>
                    <button class="action-btn" id="modalAddBtn" style="padding: 10px 20px; font-size: 14px;" onclick="addCurrentToCart()">В корзину</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbzJtg9Ot5Nz3pB7lLSL_ARx1MMa8FXbDnHH7uOCtm_44TXz0C7q1S3cAVe9dyyVX4DA/exec';

        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();  

        let allProducts = [];
        let activeCategory = 'Все';
        let cart = {}; // Ключ: название товара, Значение: объем в мл

        let currentPhotos = [];
        let currentSlideIndex = 0;
        let currentItem = null;
        let selectedQty = 5;

        async function loadProducts() {
            try {
                let response = await fetch(GOOGLE_URL, { redirect: "follow" });
                let textData = await response.text();
                allProducts = JSON.parse(textData);
                renderCategories();
                renderCatalog('Все');
            } catch (e) {
                document.getElementById('catalog').innerHTML = `<div class="loading">❌ Ошибка загрузки.</div>`;
            }
        }

        function safeString(value) {
            return (value != null) ? String(value).trim() : '';
        }

        function renderCategories() {
            let categoriesDiv = document.getElementById('categories');
            categoriesDiv.innerHTML = '';
            let categories = ['Все'];
            
            allProducts.forEach(item => {
                let cat = safeString(item['Категория']);
                if (cat && !categories.includes(cat)) { categories.push(cat); }
            });

            categories.forEach(cat => {
                let btn = document.createElement('button');
                btn.className = 'category-btn' + (cat === activeCategory ? ' active' : '');
                btn.textContent = cat;
                btn.onclick = () => {
                    tg.HapticFeedback.impactOccurred('light'); 
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeCategory = cat;
                    renderCatalog(cat);
                };
                categoriesDiv.appendChild(btn);
            });
        }

        function renderCatalog(category) {
            let catalogDiv = document.getElementById('catalog');
            catalogDiv.innerHTML = '';
            
            let filtered = category === 'Все' 
                ? allProducts 
                : allProducts.filter(item => safeString(item['Категория']) === category);
            
            if (filtered.length === 0) {
                catalogDiv.innerHTML = '<div class="loading">В этой категории пока нет товаров.</div>';
                return;
            }

            filtered.forEach(item => {
                let name = safeString(item['Название']) || 'Без названия';
                let desc = safeString(item['Описание']);
                let price = safeString(item['Цена']) || 'По запросу';
                
                let rawPhotos = safeString(item['Ссылка_на_фото']);
                let photos = rawPhotos ? rawPhotos.split(',').map(p => p.trim()).filter(p => p) : ['https://via.placeholder.com/300?text=Нет+фото'];
                let mainPhoto = photos[0];

                let card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(item, photos);

                card.innerHTML = `
                    <div class="product-img-container">
                        <img src="${mainPhoto}" alt="${name}" class="product-img">
                        ${photos.length > 1 ? `<span class="photo-badge">📷 ${photos.length}</span>` : ''}
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${name}</h3>
                        <p class="product-desc">${desc}</p>
                        <div class="product-bottom">
                            <span class="product-price">${price}</span>
                            <button class="action-btn" onclick="event.stopPropagation(); quickAdd('${name.replace(/'/g, "\\'")}')">+ 5 мл</button>
                        </div>
                    </div>
                `;
                catalogDiv.appendChild(card);
            });
        }

        function quickAdd(name) {
            tg.HapticFeedback.impactOccurred('light');
            if (!cart[name]) cart[name] = 5;
            else cart[name] += 5;
            updateCartBar();
        }

        function openModal(item, photos) {
            tg.HapticFeedback.impactOccurred('light');
            currentItem = item;
            currentPhotos = photos;
            currentSlideIndex = 0;
            selectedQty = 5;

            let name = safeString(item['Название']) || 'Без названия';
            let desc = safeString(item['Описание']) || 'Описание отсутствует';
            let price = safeString(item['Цена']) || 'По запросу';

            document.getElementById('modalTitle').textContent = name;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('modalPrice').textContent = price;
            document.getElementById('modalQty').textContent = selectedQty + ' мл';
            
            updateSlide();
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function updateModalQty(delta) {
            selectedQty += delta;
            if (selectedQty < 5) selectedQty = 5; // Минимум 5 мл
            document.getElementById('modalQty').textContent = selectedQty + ' мл';
            tg.HapticFeedback.impactOccurred('light');
        }

        function addCurrentToCart() {
            if (!currentItem) return;
            let name = safeString(currentItem['Название']);
            if (!cart[name]) cart[name] = selectedQty;
            else cart[name] += selectedQty;
            
            tg.HapticFeedback.impactOccurred('medium');
            closeModal();
            updateCartBar();
        }

        function changeSlide(direction) {
            currentSlideIndex += direction;
            if (currentSlideIndex < 0) currentSlideIndex = currentPhotos.length - 1;
            if (currentSlideIndex >= currentPhotos.length) currentSlideIndex = 0;
            updateSlide();
        }

        function updateSlide() {
            document.getElementById('modalImg').src = currentPhotos[currentSlideIndex];
            let prevBtn = document.getElementById('prevBtn');
            let nextBtn = document.getElementById('nextBtn');
            if (currentPhotos.length > 1) {
                prevBtn.style.display = 'block';
                nextBtn.style.display = 'block';
            } else {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            }
        }

        function updateCartBar() {
            let totalMl = 0;
            let totalPriceCalc = 0;

            for (let name in cart) {
                let ml = cart[name];
                totalMl += ml;
                let found = allProducts.find(p => safeString(p['Название']) === name);
                if (found && found['Цена']) {
                    let pVal = parseInt(String(found['Цена']).replace(/[^0-9]/g, '')) || 0;
                    totalPriceCalc += pVal * (ml / 5);
                }
            }

            let cartBar = document.getElementById('cartBar');
            if (totalMl > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCountText').textContent = `Общий объем: ${totalMl} мл`;
                document.getElementById('cartTotalText').textContent = totalPriceCalc > 0 ? `${totalPriceCalc} ₽` : 'Заказ корзины';
            } else {
                cartBar.style.display = 'none';
            }
        }

        function checkout() {
            tg.HapticFeedback.impactOccurred('heavy');
            
            let message = "🛍 Новый заказ из каталога:\n\n";
            for (let name in cart) {
                let ml = cart[name];
                let found = allProducts.find(p => safeString(p['Название']) === name);
                let priceStr = (found && found['Цена']) ? ` — ${found['Цена']}` : '';
                message += `▪️ ${name} — ${ml} мл${priceStr}\n`;
            }
            
            // Открывает чат с менеджером @GAGARIN_PARFUME_SHOP с предзаполненным текстом заказа
            let encodedMessage = encodeURIComponent(message);
            window.open(`https://t.me/GAGARIN_PARFUME_SHOP?text=${encodedMessage}`, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
