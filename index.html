<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagarin Parfum</title>
    <!-- Подключаем Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Красивый шрифт для витрины -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f5f7);
            --text-color: var(--tg-theme-text-color, #222);
            --card-bg: var(--tg-theme-secondary-bg-color, #fff);
            --btn-bg: var(--tg-theme-button-color, #000);
            --btn-text: var(--tg-theme-button-text-color, #fff);
            --hint-color: var(--tg-theme-hint-color, #888);
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            /* Выравниваем весь сайт по центру */
            margin: 0 auto;
            padding: 0;
            max-width: 500px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Шапка */
        header {
            padding: 20px 15px 10px;
            display: flex;
            justify-content: center;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 700; }

        /* Лента категорий по центру */
        .categories-wrapper {
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding: 10px 15px;
            z-index: 100;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .category-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--hint-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .category-btn.active {
            background: var(--btn-bg);
            color: var(--btn-text);
            border-color: var(--btn-bg);
        }

        /* Сетка товаров */
        .catalog {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            justify-items: center;
        }

        /* Карточка товара с центрированием текста */
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            width: 100%;
            align-items: center;
            text-align: center;
        }
        .product-img {
            width: 100%;
            aspect-ratio: 1; 
            object-fit: cover;
            background-color: #f0f0f0;
        }
        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            box-sizing: border-box;
        }
        .product-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 6px;
            line-height: 1.2;
        }
        .product-desc {
            font-size: 11px;
            color: var(--hint-color);
            margin: 0 0 12px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: auto;
            width: 100%;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
        }
        .buy-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .loading {
            grid-column: span 2;
            text-align: center;
            padding: 40px 20px;
            color: var(--hint-color);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gagarin Parfum</h1>
    </header>

    <div class="categories-wrapper" id="categories"></div>

    <div class="catalog" id="catalog">
        <div class="loading">⏳ Загружаем роскошные ароматы...</div>
    </div>

    <script>
        // ВСТАВЛЕНА ТВОЯ НОВАЯ ССЫЛКА
        const GOOGLE_URL = 'https://script.google.com/macros/library/d/1tWEJvIHKZwEkkShuX33bp1ZSGFIoNkkDZVjEq6gejpeRwiG4kx501MWt/1';

        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();  

        let allProducts = [];
        let activeCategory = 'Все';

        async function loadProducts() {
            try {
                let response = await fetch(GOOGLE_URL);
                allProducts = await response.json();
                
                renderCategories();
                renderCatalog('Все');
            } catch (e) {
                document.getElementById('catalog').innerHTML = '<div class="loading">❌ Ошибка загрузки данных.<br><br><small>Возможно, нужна ссылка с /exec на конце.</small></div>';
            }
        }

        function renderCategories() {
            let categoriesDiv = document.getElementById('categories');
            categoriesDiv.innerHTML = '';

            let categories = ['Все'];
            allProducts.forEach(item => {
                let cat = item['Категория'] ? item['Категория'].trim() : '';
                if (cat && !categories.includes(cat)) {
                    categories.push(cat);
                }
            });

            categories.forEach(cat => {
                let btn = document.createElement('button');
                btn.className = 'category-btn' + (cat === activeCategory ? ' active' : '');
                btn.textContent = cat;
                
                btn.onclick = () => {
                    tg.HapticFeedback.impactOccurred('light'); 
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeCategory = cat;
                    renderCatalog(cat);
                };
                categoriesDiv.appendChild(btn);
            });
        }

        function renderCatalog(category) {
            let catalogDiv = document.getElementById('catalog');
            catalogDiv.innerHTML = '';

            let filtered = category === 'Все' 
                ? allProducts 
                : allProducts.filter(item => (item['Категория'] || '').trim() === category);

            if (filtered.length === 0) {
                catalogDiv.innerHTML = '<div class="loading">В этой категории пока нет товаров.</div>';
                return;
            }

            filtered.forEach(item => {
                let price = item['Цена'] ? item['Цена'] : 'Цена по запросу';
                let imgUrl = item['Ссылка_на_фото'] ? item['Ссылка_на_фото'] : 'https://via.placeholder.com/300?text=Нет+фото';
                
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${imgUrl}" alt="${item['Название']}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-title">${item['Название']}</h3>
                        <p class="product-desc">${item['Описание'] || ''}</p>
                        <div class="product-bottom">
                            <span class="product-price">${price}</span>
                            <button class="buy-btn" onclick="buy('${item['Название'].replace(/'/g, "\\'")}')">В КОРЗИНУ</button>
                        </div>
                    </div>
                `;
                catalogDiv.appendChild(card);
            });
        }

        function buy(name) {
            tg.HapticFeedback.impactOccurred('medium'); 
            tg.MainButton.text = "ОФОРМИТЬ ЗАКАЗ: " + name;
            tg.MainButton.color = tg.themeParams.button_color || "#000000";
            tg.MainButton.textColor = tg.themeParams.button_text_color || "#ffffff";
            tg.MainButton.show();
            
            tg.MainButton.onClick(() => {
                tg.sendData(name);
            });
        }

        loadProducts();
    </script>
</body>
</html>
