<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Специальное предложение на сеты</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #050505;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Главный баннер */
    .promo-banner {
      width: 100%;
      max-width: 850px;
      background: linear-gradient(145deg, #141416 0%, #09090a 50%, #18181c 100%);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 50px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                  inset 0 0 40px rgba(212, 175, 55, 0.05);
    }

    .promo-banner::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 55%);
      pointer-events: none;
    }

    .gold-text {
      background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .promo-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 8px 24px;
      border-radius: 50px;
      border: 1px solid #D4AF37;
      background: rgba(212, 175, 55, 0.08);
      margin-bottom: 20px;
    }

    .promo-title {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .price-block {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .old-price {
      font-size: 28px;
      color: #777777;
      text-decoration: line-through;
      font-weight: 500;
    }

    .new-price {
      font-size: 48px;
      font-weight: 900;
    }

    .promo-description {
      color: #d1d1d1;
      font-size: 17px;
      line-height: 1.6;
      max-width: 640px;
      margin: 0 auto 32px auto;
      font-weight: 300;
    }

    .promo-description strong {
      color: #FCF6BA;
      font-weight: 600;
    }

    /* Кнопка */
    .promo-btn {
      display: inline-block;
      padding: 18px 48px;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #000000;
      background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 30%, #B38728 70%, #AA771C 100%);
      background-size: 200% auto;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(179, 135, 40, 0.3);
    }

    .promo-btn:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(179, 135, 40, 0.5);
    }

    /* Модальное окно (Форма заказа) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: #141416;
      border: 1px solid #D4AF37;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 40px rgba(212, 175, 55, 0.2);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #888;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #fff;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: #d1d1d1;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: #09090a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-input:focus {
      border-color: #D4AF37;
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
    }

    /* Адаптивность */
    @media (max-width: 768px) {
      .promo-banner { padding: 35px 20px; }
      .promo-title { font-size: 25px; }
      .new-price { font-size: 36px; }
      .old-price { font-size: 22px; }
      .promo-description { font-size: 15px; }
      .promo-btn { width: 100%; padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <div class="promo-banner">
    <span class="promo-badge gold-text">Эксклюзивный сет</span>
    
    <h1 class="promo-title gold-text">Специальное предложение на сеты</h1>
    
    <div class="price-block">
      <span class="old-price">150 ₽</span>
      <span class="new-price gold-text">100 ₽</span>
    </div>

    <p class="promo-description">
      Выбирайте любые ароматы из нашей коллекции. При общем объёме заказа <strong>от 100 мл</strong> итоговая стоимость составит всего <strong>100 ₽</strong>. Сочетайте любимые ноты в любых пропорциях!
    </p>

    <button class="promo-btn" id="openModalBtn">Принять участие</button>
  </div>

  <!-- Всплывающее окно формы -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <span class="modal-close" id="closeModalBtn">&times;</span>
      <h2 class="gold-text" style="font-size: 24px; margin-bottom: 10px;">Оформление заказа</h2>
      <p style="color: #aaa; font-size: 14px; margin-bottom: 25px;">Оставьте контакты, чтобы зафиксировать скидку</p>
      
      <form id="orderForm">
        <div class="form-group">
          <label for="userName">Ваше имя</label>
          <input type="text" id="userName" class="form-input" placeholder="Иван" required>
        </div>
        <div class="form-group">
          <label for="userContact">Телефон или Telegram</label>
          <input type="text" id="userContact" class="form-input" placeholder="+7 (999) 000-00-00 или @username" required>
        </div>
        <button type="submit" class="promo-btn submit-btn">Забронировать скидку</button>
      </form>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modalOverlay');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const form = document.getElementById('orderForm');

    // Открыть форму
    openBtn.addEventListener('click', () => {
      modal.style.display = 'flex';
    });

    // Закрыть форму по крестику
    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // Закрыть форму при клике вне окна
    window.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });

    // Действие при отправке
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('userName').value;
      alert(`Спасибо, ${name}! Заявка принята. Мы свяжемся с вами в ближайшее время.`);
      modal.style.display = 'none';
      form.reset();
    });
  </script>

</body>
</html>
