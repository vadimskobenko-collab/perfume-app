<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Духов</title>
    <!-- Подключаем сам Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Наводим красоту (дизайн) -->
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #000);
            padding: 15px;
            margin: 0;
        }
        .product {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .product img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product h3 { margin: 10px 0 5px; font-size: 18px; }
        .product p { font-size: 14px; color: #666; margin: 0 0 10px; }
        .price { font-weight: bold; font-size: 18px; margin-bottom: 10px; color: #2ecc71; }
        button {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="catalog">⏳ Загружаем духи из таблицы...</div>

    <!-- Пишем логику работы -->
    <script>
        // ВСТАВЬ СВОЮ ССЫЛКУ ИЗ GOOGLE ТАБЛИЦ В КАВЫЧКИ НИЖЕ:
        const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbzDOq4pYY1SDKxNSeHb6nO_aBX2B6AeN_clLhc3LJ2myVI_OCNF6xzEN7pd0iWpD0mh/exec';

        let tg = window.Telegram.WebApp;
        tg.expand(); // Открываем приложение на весь экран телефона

        // Функция получения данных из таблицы
        async function loadProducts() {
            try {
                let response = await fetch(GOOGLE_URL);
                let data = await response.json();
                
                let catalogDiv = document.getElementById('catalog');
                catalogDiv.innerHTML = ''; // Убираем надпись "Загружаем..."

                data.forEach(item => {
                    let productDiv = document.createElement('div');
                    productDiv.className = 'product';
                    productDiv.innerHTML = `
                        <img src="${item['Ссылка_на_фото']}" alt="${item['Название']}">
                        <h3>${item['Название']}</h3>
                        <p>${item['Описание']}</p>
                        <div class="price">${item['Цена']}</div>
                        <button onclick="buy('${item['Название']}')">Купить</button>
                    `;
                    catalogDiv.appendChild(productDiv);
                });
            } catch (e) {
                document.getElementById('catalog').innerHTML = '❌ Ошибка загрузки товаров.';
            }
        }

        // Функция нажатия на кнопку "Купить"
        function buy(name) {
            tg.MainButton.text = "Оформить заказ: " + name;
            tg.MainButton.show();
            // Когда пользователь нажмет главную кнопку внизу
            tg.MainButton.onClick(() => {
                // Отправляем данные в бота
                tg.sendData(name); 
            });
        }

        // Запускаем загрузку товаров при открытии
        loadProducts();
    </script>
</body>
</html>
