<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Логотип по центру</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f0f11;
      min-height: 100vh;
    }

    /* Шапка с идеальным центрированием */
    .header {
      width: 100%;
      min-height: 120px;
      background-color: #1a1a1e;
      display: flex;
      justify-content: center; /* По горизонтали */
      align-items: center;     /* По вертикали */
      padding: 20px;
      border-bottom: 1px solid #2a2a30;
    }

    /* Ссылка-обертка */
    .logo-link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .logo-link:hover {
      transform: scale(1.03);
    }

    /* Стили для SVG-логотипа */
    .logo-svg {
      width: 180px;      /* Настрой нужную ширину */
      height: auto;      /* Пропорции сохраняются автоматически */
      display: block;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="#" class="logo-link" aria-label="Главная">
      <!-- Встроенный код логотипа (SVG) -->
      <svg class="logo-svg" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="50" rx="10" fill="#3B82F6"/>
        <path d="M30 15L45 35H15L30 15Z" fill="white"/>
        <text x="60" y="32" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="20">LOGO</text>
      </svg>
    </a>
  </header>

</body>
</html>
